<head>
    <meta charset="UTF-8">

    <title>قائمة الأفعال الهولندية الشاملة</title>
    <style>
        :root {
            --primary-color: #007bb6;
            --whatsapp-color: #25D366;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 700px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
        }

        .clock-box {
            font-size: 0.88em;
            color: #555;
            background: #eef6fa;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
        }

        .search-box {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 15px;
            border: 1px solid #cbdbe6;
            border-radius: 8px;
            font-size: 0.95em;
            box-sizing: border-box;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--primary-color);
        }

        .data-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #f0f0f0;
            gap: 10px;
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .data-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 3px;
        }

        .row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dutch-word {
            font-weight: bold;
            color: #111;
            font-size: 1.05em;
            direction: ltr;
        }

        .arabic-word {
            color: #222;
            font-size: 0.95em;
            font-weight: 600;
        }

        .phonetic-word {
            color: #777;
            font-size: 0.85em;
            direction: rtl;
        }

        .btn-small {
            background-color: #f0f4f8;
            color: var(--primary-color);
            border: 1px solid #cbdbe6;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .btn-small:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-copy-all {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-copy-all:hover {
            background-color: #005f8d;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp-color);
            color: white;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-whatsapp:hover {
            background-color: #1eb956;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .toast {
            visibility: hidden;
            min-width: 220px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: fixed;
            z-index: 10;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>

    </div>

    // 1. عداد الوقت والتاريخ المباشر
    function updateClock() {
        const now = new Date();
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit' 
        };
        document.getElementById('liveClock').innerText = now.toLocaleDateString('ar-EG', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. عرض العناصر
    function renderVerbs(data) {
        const listElement = document.getElementById('verbList');
        listElement.innerHTML = '';
        
        data.forEach(item => {
            const li = document.createElement('li');
            li.className = 'data-item';
            
            const phoneticHTML = item.phonetic ? `<span class="phonetic-word">— النطق: ${item.phonetic}</span>` : '';
            
            li.innerHTML = `
                <div class="data-info">
                    <div class="row-top">
                        <span class="dutch-word">${item.dutch}</span>
                        <span class="arabic-word">${item.arabic}</span>
                    </div>
                    ${phoneticHTML}
                </div>
                <button class="btn-small" onclick="copySingle('${item.dutch}', '${item.arabic}', '${item.phonetic}')">نسخ</button>
            `;
            listElement.appendChild(li);
        });
    }

    renderVerbs(verbs);

    // 3. التصفية والبحث
    function filterVerbs() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = verbs.filter(item => 
            item.dutch.toLowerCase().includes(query) || 
            item.arabic.includes(query) || 
            item.phonetic.includes(query)
        );
        renderVerbs(filtered);
    }

    // 4. تجهيز النص الكامل للنسخ والمشاركة
    function getFormattedText() {
        let text = "*قائمة الأفعال الهولندية مترجمة:* \n\n";
        verbs.forEach(item => {
            if (item.phonetic) {
                text += `• *${item.dutch}* — ${item.arabic} (${item.phonetic})\n`;
            } else {
                text += `• *${item.dutch}* — ${item.arabic}\n`;
            }
        });
        return text;
    }

    // 5. نسخ فعل واحد
    function copySingle(dutch, arabic, phonetic) {
        let textToCopy = `${dutch} — ${arabic}`;
        if (phonetic) textToCopy += ` (${phonetic})`;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            showToast(`تم نسخ: ${dutch}`);
        });
    }

    // 6. نسخ كل البيانات
    function copyAllData() {
        navigator.clipboard.writeText(getFormattedText()).then(() => {
            showToast('تم نسخ جميع الأفعال بنجاح!');
        });
    }

    // 7. إعداد رابط الواتساب
    function setupWhatsApp() {
        const encodedText = encodeURIComponent(getFormattedText());
        document.getElementById('whatsappLink').href = `https://api.whatsapp.com/send?text=${encodedText}`;
    }
    setupWhatsApp();

    // إظهار التنبيه (Toast)
    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "toast show";
        setTimeout(() => { 
            toast.className = toast.className.replace("show", ""); 
        }, 2000);
    }
</script>
